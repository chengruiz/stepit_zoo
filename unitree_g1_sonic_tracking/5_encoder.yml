model_path: assets/model_encoder.onnx
nnrt_factory: tensorrt

tensorrt_options:
  precision: fp32
  device_id: 0
  engine_path: model_encoder.fp32.engine
  force_rebuild: false

input_field:
  - { name: encoder_mode_4,                                  size: 4   }  # shared mode selector: g1(mode 0) / teleop(mode 1) / smpl(mode 2)
  - { name: motion_joint_positions_10frame_step5,            size: 290 }  # g1 / tracking only (mode 0)
  - { name: motion_joint_velocities_10frame_step5,           size: 290 }  # g1 / tracking only (mode 0)
  - { name: motion_root_z_position_10frame_step5,            size: 10  }  # reserved in released encoder ABI; zero-filled in current tracking setup
  - { name: motion_root_z_position,                          size: 1   }  # reserved in released encoder ABI; zero-filled in current tracking setup
  - { name: motion_anchor_orientation,                       size: 6   }  # teleop only (mode 1)
  - { name: motion_anchor_orientation_10frame_step5,         size: 60  }  # g1 / tracking only (mode 0)
  - { name: motion_joint_positions_lowerbody_10frame_step5,  size: 120 }  # teleop only (mode 1)
  - { name: motion_joint_velocities_lowerbody_10frame_step5, size: 120 }  # teleop only (mode 1)
  - { name: vr_3point_local_target,                          size: 9   }  # teleop only (mode 1)
  - { name: vr_3point_local_orn_target,                      size: 12  }  # teleop only (mode 1)
  - { name: smpl_joints_10frame_step1,                       size: 720 }  # smpl only (mode 2)
  - { name: smpl_anchor_orientation_10frame_step1,           size: 60  }  # smpl only (mode 2)
  - { name: motion_joint_positions_wrists_10frame_step1,     size: 60  }  # smpl only (mode 2)

output_field:
  - { name: token_state, size: 64 }

assert_all_finite: true
