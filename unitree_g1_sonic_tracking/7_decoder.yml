model_path: assets/model_decoder.onnx
nnrt_factory: tensorrt

tensorrt_options:
  precision: fp32
  device_id: 0
  engine_path: model_decoder.fp32.engine
  force_rebuild: false

input_field:
  - { name: token_state,                             size: 64  }
  - { name: his_base_angular_velocity_10frame_step1, size: 30  }
  - { name: his_body_joint_positions_10frame_step1,  size: 290 }
  - { name: his_body_joint_velocities_10frame_step1, size: 290 }
  - { name: his_last_actions_10frame_step1,          size: 290 }
  - { name: his_gravity_dir_10frame_step1,           size: 30  }

output_field:
  - { name: action, size: 29 }

assert_all_finite: true
